[package]
name = "bridgey-linux"
description = "Bridgey by Round Robin for Linux: GTK4 and libadwaita on the shared session client (docs/session-client.md)"
version = "0.1.0"
edition = "2021"
license = "MIT"
# gtk4-rs 0.11 needs Rust 1.92.
rust-version = "1.92"
publish = false

# Its own workspace and lock file: the GTK stack never enters rust/Cargo.lock, so the Android, Mac, Windows and CLI
# builds of rust/ are unchanged.
[workspace]

[[bin]]
name = "bridgey-linux"
path = "src/main.rs"

[dependencies]
bridgey-client = { path = "../rust/client" }
# GTK 4.14 and libadwaita 1.5 (Ubuntu 24.04, Fedora 40, Debian 13) are the floor; the AppImage carries them.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.14", features = ["xfixes", "screensaver"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
