# Local test settings only (server/local/live-test.sh): the control service on the tailnet,
# one relay (coturn in a container on the same host). Never deployed.
[server]
listen = "100.121.85.33:18450"
trust_proxy = false
public_host = "100.121.85.33:18450"
environment = "local"

[[relays]]
id = "sxb"
kind = "coturn"
