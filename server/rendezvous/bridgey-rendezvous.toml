# Bridgey Rendezvous (the Connect anywhere control service): production settings.
# The one settings file. Only secrets come from the environment (the *_env names below).
# Spec: docs/connect-anywhere.md, sections 6 and 9. Deploy runbook: docs/connect-anywhere-deploy.md.

[server]
listen = "0.0.0.0:8080"
# connect.roundrobin.in is served through the host nginx on rr-web, which sets X-Real-IP.
trust_proxy = true
environment = "production"
# What clients sign in a single-flight sign-in (hello in the upgrade request); nginx forwards another Host.
public_host = "connect.roundrobin.in"
# The Cloudflare credentials out, kept across restarts. The image makes the folder; a volume mounted there keeps it
# across deploys too. Without the file a start assumes the budget's worth is out, expiring over 12 hours.
state_file = "/var/lib/bridgey-rendezvous/cloudflare-credentials.json"

[limits]
max_ids = 64
sockets_per_node = 3
signals_per_minute = 120
# Every ICE session takes one grant per side (a claim counts too), and a Mac answers for all its phones;
# 30 ran out in an hour of app restarts during the 2026-10-30 live test.
grants_per_hour = 120
connections_per_ip = 32
max_connections = 20000
pow_bits = 0
grant_lifetime_s = 7200
# A node's own (warm) relay credentials; it renews them in their last hour.
warm_grant_lifetime_s = 43200
auth_timeout_s = 10
# Any message, per connection: past it they are dropped, past twice it the connection closes (one lock serves all).
messages_per_minute = 600
# Session grants remembered for the other side's claim: in all (the oldest makes room) and per address group.
max_pending = 100000
pending_per_ip = 1000
# Connections on one rendezvous ID (a pair is two nodes of at most three sockets each).
sockets_per_rdv = 8

# Relay pool (section 9.1). Cloudflare Realtime TURN comes first for clients that can use it (Rahul, 2026-11-24);
# the own coturn relays are the backup, and the only relays older clients ever get. Among the own relays,
# penalties steer India to bom first and keep sxb (the build server) last.
#
# Cloudflare: credentials are minted per grant with the TURN key in CF_TURN_KEY_ID and CF_TURN_API_TOKEN. Usage
# is read from Cloudflare's GraphQL analytics (CF_ACCOUNT_ID, CF_ANALYTICS_TOKEN); without a fresh reading, or at
# hard_gb, no Cloudflare grants are made, so the free 1,000 GB a month is never exceeded.
[[relays]]
id = "cf"
kind = "cloudflare"
# The URLs clients get from Cloudflare's answer: UDP 3478, and TLS on 443 where UDP is blocked.
urls = ["turn:turn.cloudflare.com:3478?transport=udp", "turns:turn.cloudflare.com:443?transport=tcp"]
stun = "turn.cloudflare.com:3478"
max_kbps = 40000

[relays.cloudflare]
soft_gb = 800
hard_gb = 950
usage_interval_s = 900
usage_interval_near_s = 60
usage_max_age_s = 3600
# 0: the last window_days days (covers any billing month); set the billing day here once it is confirmed.
cycle_day = 0
window_days = 31
# Credentials out at once are budgeted so that, each at budget_kbps (the top of Cloudflare's per-client rate) until
# the next reading plus budget_extra_s, they stay under hard_gb. At a reading the excess is revoked: replaced
# credentials first, then session ones, a node's live warm one last; all of them at the hard cap. A stale reading
# stops minting and revokes nothing. 0 turns the budget and revocations off. Per address (IPv4, or IPv6 /64):
# mints_per_ip_hour.
budget_kbps = 100000
budget_extra_s = 300
mints_per_ip_hour = 30

[[relays]]
id = "bom"
kind = "coturn"
urls = ["turn:relay-in.roundrobin.in:3478?transport=udp"]
secret_env = "TURN_SECRET_BOM"
penalty_ms = 0
max_kbps = 50000

[[relays]]
id = "sin"
kind = "coturn"
urls = ["turn:relay-sg.roundrobin.in:3478?transport=udp"]
secret_env = "TURN_SECRET_SIN"
penalty_ms = 10
max_kbps = 50000

[[relays]]
id = "sxb"
kind = "coturn"
urls = ["turn:relay-eu.roundrobin.in:3478?transport=udp"]
secret_env = "TURN_SECRET_SXB"
penalty_ms = 40
max_kbps = 50000
