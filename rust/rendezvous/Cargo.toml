[package]
name = "bridgey-rendezvous"
description = "Connect anywhere control service: node authentication, presence, sealed signalling, relay credentials"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
bridgey-connect-proto = { path = "../proto" }
base64.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
futures-util.workspace = true
axum.workspace = true
toml.workspace = true
# HTTPS to Cloudflare's API (TURN credentials and usage), with the Web PKI roots built in: the image is `scratch`.
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
