# The C header for bridgey_core (include/bridgey_core.h). Regenerate with
#   BRIDGEY_WRITE_HEADER=1 cargo test -p bridgey-client --test header
language = "C"
include_guard = "BRIDGEY_CORE_H"
cpp_compat = true
usize_is_size_t = true
documentation = true
documentation_style = "c99"
header = """/*
 * Bridgey session client (bridgey_core): discovery, protocol 2 pairing, trusted devices, encrypted
 * sessions, features and clipboard text for new platforms. See docs/session-client.md.
 *
 * Ownership: strings passed in are borrowed for the call; strings and events returned are owned by the
 * library and freed with bridgey_string_free and bridgey_event_free. A client is a uint64_t handle.
 */"""
autogen_warning = "/* Generated by cbindgen from rust/client/src/ffi.rs. Do not edit; see cbindgen.toml. */"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true

[export]
include = ["BridgeySendStatus", "BridgeyPhoneArea"]
exclude = ["ABI_VERSION", "DEFAULT_PORT", "ALLOW_DEFAULT", "CLIPBOARD_MAX", "HEARTBEAT", "HEARTBEAT_TIMEOUT", "HANDSHAKE_TIMEOUT", "CODE_TIMEOUT", "MAX_BAD_FRAMES", "REPLAY_WINDOW", "MAX_FRAME", "PROTOCOL_VERSION", "REQUIRED", "OPTIONAL", "ADDRESSES_PER_DEVICE", "BLOCK", "LIFETIME_MS", "PER_PEER", "TOTAL", "MAX_KEPT_BYTES", "CHECKPOINT_EVERY", "MAX_MESSAGE", "READ_BUDGET", "READ_QUEUE", "FREE_SPACE_MARGIN"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
