[package]
name = "bridgey-cli"
description = "bridgey: the agent command for Bridgey by Round Robin (docs/agent-cli.md)"
edition.workspace = true
license.workspace = true
version = "0.1.0"

[[bin]]
name = "bridgey"
path = "src/main.rs"

[dependencies]
bridgey-connect = { path = "../core" }
bridgey-connect-proto = { path = "../proto" }
base64.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs", "signal", "process"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "env"] }
qrcode = { version = "0.14", default-features = false }
libc = "0.2"
