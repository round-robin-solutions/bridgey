[workspace]
resolver = "2"
members = ["proto", "core", "rendezvous"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
md-5 = "0.10"
crc32fast = "1"
if-addrs = "0.14"
socket2 = "0.6"
jni = "0.21"
axum = { version = "0.8", features = ["ws"] }
toml = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
