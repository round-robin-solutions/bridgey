# Bridgey by Round Robin: the single place for edition settings.
# Read by android/app/build.gradle.kts, macos/build-app.sh and scripts/rr/*.
# Plain KEY=value lines only (no quotes, no spaces around "=").

EDITION_APP_ID=in.roundrobin.bridgey
EDITION_DISPLAY_NAME=Bridgey by Round Robin
EDITION_SHORT_NAME=Bridgey RR
# File name of the macOS app bundle (without .app) and the DMG volume name.
EDITION_MAC_APP_NAME=Bridgey by Round Robin
# Prefix of every release asset file name.
EDITION_ASSET_PREFIX=Bridgey-RR

# The next stable version. Nightlies and betas build towards it; bump it right
# after publishing a stable release (see docs/rr-edition.md).
EDITION_NEXT_VERSION=0.11.0-rr.1

GITHUB_REPO=round-robin-solutions/bridgey
# Branch every published build comes from (checked by scripts/rr/ci-release.sh and publish.sh).
RELEASE_BRANCH=rr/main
# Fixed release tag whose assets are overwritten on each publish.
UPDATE_CHANNELS_TAG=channels
UPDATE_FEED_BASE_URL=https://github.com/round-robin-solutions/bridgey/releases/download/channels
# Updaters only download assets whose URL starts with this prefix.
UPDATE_ASSET_URL_PREFIX=https://github.com/round-robin-solutions/bridgey/releases/download/

# Codes from messages: the relay that asks Cloudflare Workers AI for the code (services/otp-proxy).
# No key ships in the apps; the relay binds Workers AI. Empty: the setting shows "not available".
OTP_PROXY_URL=https://bridgey-otp-proxy.cs-share.workers.dev
# Codes from messages > On this Mac: the on-device model's manifest, on the fixed `models` release.
# A newer version there is offered in Settings without an app update.
OTP_MODEL_MANIFEST_URL=https://github.com/round-robin-solutions/bridgey/releases/download/models/otp-model.json
MODELS_TAG=models

# Connect anywhere: the control service (docs/connect-anywhere.md). Empty means the setting says
# "not available". Not deployed yet: see docs/connect-anywhere-deploy.md.
CONNECT_CONTROL_URL=wss://connect.roundrobin.in/v1/ws

# Public SHA-256 fingerprint of the release signing certificate (not a secret).
ANDROID_CERT_SHA256=5F:D2:93:18:C6:8B:8B:FE:2D:3A:06:24:8C:5A:0F:08:62:02:FB:9B:94:F8:B7:F1:A7:27:07:D6:18:3F:44:AE
# Google Play upload key (signs the "play" AAB; Play re-signs with the release key above).
ANDROID_UPLOAD_CERT_SHA256=f3cbdd7b5a24305f5fedd24ccb4a2996a139b0d8be252e2c13dfcaa50fcc95a6
# Test key: "qa" builds only (scripts/rr/build-android-store.sh qa). Never on a public channel.
ANDROID_TEST_CERT_SHA256=055f3afb16ef44b06a589a396deca50c5b23ab6f9361837fcdfc3051c799ea85
# The Sparkle EdDSA public key lives in macos/Resources/Info.plist (SUPublicEDKey).
